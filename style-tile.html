<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guaraná Antarctica — Direção visual</title><link rel="stylesheet" href="styles.css"><style>body{padding:45px 6vw}main{max-width:1150px;margin:auto}.tile-header{border-bottom:1px solid #ffffff60;padding-bottom:28px}.tile-header img{width:238px;background:white;padding:12px;border-radius:3px}h1{font:700 clamp(50px,8vw,120px)/1 var(--display);letter-spacing:normal;margin:50px 0 30px}h2{font:400 50px var(--campaign)}.sample{font-size:18px;line-height:1.5}.palette{display:flex;gap:18px;flex-wrap:wrap;margin:35px 0}.swatch{width:170px;font-size:13px}.color{height:90px;background:var(--c)}.visuals{display:flex;gap:80px;align-items:center;justify-content:center;padding:40px 0}.visuals img{height:350px;width:auto}.tile-link{display:inline-block;background:#fff;color:var(--deep);padding:15px 26px;border-radius:40px;font-family:var(--display);font-weight:700}@media(max-width:700px){.visuals{gap:35px}.visuals img{height:220px}h2{font-size:38px}}</style><main><div class="tile-header"><img src="assets/logo-horizontal.webp" alt="Guaraná Antarctica"></div><h1>ORIGINAL<br>DO BRASIL.</h1><p class="sample">Guarana Antarctica Bold / Regular.<br>Kranafat para campanhas. Roboto para navegação e leitura.</p><div class="palette"><div class="swatch"><div class="color" style="--c:#00843d"></div><p>Verde / #00843D</p></div><div class="swatch"><div class="color" style="--c:#005331"></div><p>Verde profundo / #005331</p></div><div class="swatch"><div class="color" style="--c:#ffcc00"></div><p>Amarelo / #FFCC00</p></div><div class="swatch"><div class="color" style="--c:#df171f"></div><p>Vermelho / #DF171F</p></div><div class="swatch"><div class="color" style="--c:#ffffff"></div><p>Branco / #FFFFFF</p></div></div><h2>É COISA NOSSA.</h2><div class="visuals"><img src="assets/can.webp" alt="Guaraná Antarctica Original"><img src="assets/zero.webp" alt="Guaraná Antarctica Zero"></div><a class="tile-link" href="index.html">Abrir experiência</a></main></html>
